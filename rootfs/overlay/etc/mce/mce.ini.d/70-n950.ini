# Nokia N950 for Leste's mce, after the N900's (leste-config-n900): the
# keyboard light is LP5523 channels 0-5 (lp5523:kb1-kb6, as Harmattan's
# mce drives them), the white LED on channel 8 is not used yet.
[Modules]
ModulesDevice=evdevvibrator;button-backlight;battery-guard

[Backlights]
ConfiguredLights=lp5523:kb1;lp5523:kb2;lp5523:kb3;lp5523:kb4;lp5523:kb5;lp5523:kb6
lp5523:kb1=1;1;0;0;0;0
lp5523:kb2=1;0;0;0;0;0
lp5523:kb3=1;0;0;0;0;0
lp5523:kb4=1;0;0;0;0;0
lp5523:kb5=1;0;0;0;0;0
lp5523:kb6=1;0;0;0;0;0

[Battery]
UseCapacityLevel=true
CapacityLevelLowCritical=true
EmptyPercentage=-1
