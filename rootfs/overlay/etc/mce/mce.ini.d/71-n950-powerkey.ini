# Needs Leste's mce with mce/patches/0001 (the stock mce ignores the key).
# false: a power-key press shows the lockscreen, which a swipe unlocks (the
# default again since mce/patches/0002: the "unreliable swipe" was mostly the
# display staying dark after the first lock). true: the press wakes and
# unlocks at once, without the lockscreen.
[PowerKey]
PowerKeyUnlocks=false
