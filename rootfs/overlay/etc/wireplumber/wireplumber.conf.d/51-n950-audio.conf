# Nokia N950: PipeWire gives the loudspeaker sink a higher session priority
# (1000) than the headphones (728), so WirePlumber stayed on the loudspeaker
# with headphones plugged in. Rank the headphones first, in HiFi and in the
# Voice Call profiles; while nothing is plugged their route is unavailable
# ("Headphone Jack" off) and WirePlumber leaves them out, so the loudspeaker
# (or the earpiece) takes over again.
#
# The FM receiver's capture (card "N950 FM", used by n950-fm-audio by its
# name) had the same priority as the microphone and became the default
# source, so a call (cmt_pulse records the default source) would have sent
# the radio. Rank it last.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*__Headphones__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 1100
        priority.driver = 1100
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.platform-sound-fm.*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
        priority.driver = 100
      }
    }
  }
]
