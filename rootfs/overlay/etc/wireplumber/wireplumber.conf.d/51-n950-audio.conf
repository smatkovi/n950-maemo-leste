# Nokia N950: PipeWire gives the loudspeaker sink a higher session priority
# (1000) than the headphones (728), so WirePlumber stayed on the loudspeaker
# with headphones plugged in. Rank the headphones first; while nothing is
# plugged their route is unavailable ("Headphone Jack" off) and WirePlumber
# leaves them out, so the loudspeaker takes over again.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 1100
        priority.driver = 1100
      }
    }
  }
]
