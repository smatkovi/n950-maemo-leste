# sphone initialises no module after one that fails. contacts-ui-abook fails
# when the Evolution address book does not answer within 25 s, as on a slow
# boot, which left incoming calls ringing without a window and unlogged. Load
# it last, so a failure there only costs the contact picker.
[Modules]
Modules=rtconf-libprofile;route-pulseaudio;playback-gstreamer;sphone-mce;comm-ofono;commtest;manager;external-exec;contacts-evolution;comm-error-gtk;store-rtcom;ui-dialer-gtk;ui-dtmf-gtk;ui-history-calls-gtk;ui-messages-gtk;ui-options-gtk;ui-message-threads-gtk;notify-libnotify;ui-calls-manager-gtk;contacts-ui-abook
