# N950 keyboard (TWL5031 keypad matrix, keycodes from the device tree):
# xkeyboard-config has no model for it: the plain US layout until the
# session compiles Nokia's (Xsession.post/26n950-keyboard).
Section "InputClass"
	Identifier	"keyboard defaults"
	MatchIsKeyboard	"on"
	Option		"XkbModel"	"pc105"
	Option		"XkbLayout"	"us"
EndSection
