# N950: omapdrm with a DSI command-mode panel (panel-dsi-cm, like the
# Droid 4's), so the X driver has to send every update to the panel.
Section "Device"
	Identifier	"Video Device"
	Driver		"omap"
	Option		"ManualUpdate"	"true"
EndSection

Section "Screen"
	Identifier	"Screen"
	Monitor		"Monitor"
	Device		"Video Device"
EndSection
