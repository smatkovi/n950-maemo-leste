# Phone calls. The modem's speech frames reach the CPU over SSI
# (/dev/cmt_speech); cmt_pulse (libcmtspeechdata) plays the downlink and
# records the uplink through PipeWire, 8 kHz mono. sphone switches the card
# to one of the "Voice Call" profiles while a call is active and picks the
# one with the output it wants (earpiece, loudspeaker or headphones).
#
# Settings after Nokia's PulseAudio paths in Harmattan
# (nokia-dfl61-twl4030-output-earpiece, -output-ihf,
# -input-internal-microphones). Harmattan's own speech processing (echo
# cancellation, noise suppression) is not there, so the loudspeaker has no
# echo cancellation.

SectionVerb {
	EnableSequence [
		# TWL5031: everything from DAC2, DAC1 and the TWL's voice port
		# unused, no output selected yet
		cset "name='DAC1 Analog Playback Switch' off,off"
		cset "name='DAC2 Analog Playback Switch' on,on"
		cset "name='Earpiece Mixer AudioL1' off"
		cset "name='Earpiece Mixer AudioL2' off"
		cset "name='Earpiece Mixer AudioR1' off"
		cset "name='Earpiece Mixer Voice' off"
		cset "name='PredriveL Mixer AudioL1' off"
		cset "name='PredriveL Mixer AudioL2' off"
		cset "name='PredriveL Mixer AudioR2' off"
		cset "name='PredriveL Mixer Voice' off"
		cset "name='PredriveR Mixer AudioR1' off"
		cset "name='PredriveR Mixer AudioR2' off"
		cset "name='PredriveR Mixer Voice' off"
		cset "name='Left Digital Loopback Volume' 0"
		cset "name='Right Digital Loopback Volume' 0"
		# DAC33 for the headphones, as in HiFi
		cset "name='DAC33 DAC Digital Playback Volume' 127,127"
		cset "name='DAC33 DAC Digital Playback Switch' on,on"
		cset "name='DAC33 Line to Line Out Volume' 0,0"
		cset "name='DAC33 Analog Left Bypass Switch' off"
		cset "name='DAC33 Analog Right Bypass Switch' off"
		cset "name='DAC33 Left LOM Inverted From' DAC"
		cset "name='DAC33 Right LOM Inverted From' DAC"
	]
	DisableSequence [
		cset "name='DAC1 Analog Playback Switch' on,on"
	]
	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		# DAC2 left to the earpiece amplifier: DAC2 at +4 dB digital
		# (coarse +6, fine -2) and +10 dB analog, earpiece stage at
		# setting 2, Nokia's values
		cset "name='DAC2 Digital Coarse Playback Volume' 1,1"
		cset "name='DAC2 Digital Fine Playback Volume' 61,61"
		cset "name='DAC2 Analog Playback Volume' 17,17"
		cset "name='Earpiece Playback Volume' 2"
		cset "name='Earpiece Mixer AudioL2' on"
		# sidetone, TX1 right into DAC2 at 0 dB, Nokia's setting
		cset "name='Right Digital Loopback Volume' 7"
		cset "name='Earpiece Switch' on"
	]
	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='Earpiece Playback Volume' 0"
		cset "name='Right Digital Loopback Volume' 0"
		cset "name='Earpiece Mixer AudioL2' off"
		cset "name='DAC2 Digital Coarse Playback Volume' 0,0"
		cset "name='DAC2 Digital Fine Playback Volume' 63,63"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Earpiece"
	]
	EnableSequence [
		# as in HiFi (Nokia's ihf path): DAC2 left over the right
		# predriver to the loudspeaker amplifier
		cset "name='DAC2 Digital Coarse Playback Volume' 0,0"
		cset "name='DAC2 Digital Fine Playback Volume' 63,63"
		cset "name='DAC2 Analog Playback Volume' 18,18"
		cset "name='PredriveR Mixer AudioL2' on"
		cset "name='PreDriv Playback Volume' 2,2"
		cset "name='Speaker Switch' on"
	]
	DisableSequence [
		cset "name='Speaker Switch' off"
		cset "name='PredriveR Mixer AudioL2' off"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		cset "name='TPA6140A2 Headphone Playback Volume' 21"
		cset "name='Headphone Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Switch' off"
	]
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
	}
}

# The digital microphones through TX1, also with headphones plugged in
# (a headset microphone needs the plug type, which nothing reports yet)
SectionDevice."Mic" {
	Comment "Internal microphone"
	EnableSequence [
		cset "name='Analog Left Main Mic Capture Switch' off"
		cset "name='Analog Left Headset Mic Capture Switch' off"
		cset "name='Analog Left AUXL Capture Switch' off"
		cset "name='Analog Left Carkit Mic Capture Switch' off"
		cset "name='Analog Right Sub Mic Capture Switch' off"
		cset "name='Analog Right AUXR Capture Switch' off"
		cset "name='TX1 Capture Route' Digimic0"
		cset "name='Digimic LR Swap' Swapped"
		# 0 dB, Nokia's setting: at +15 dB (HiFi's) the room alone
		# measured -31 dBFS, too little headroom for speech up close
		cset "name='TX1 Digital Capture Volume' 0,0"
		cset "name='Digital Mic Switch' on"
	]
	DisableSequence [
		cset "name='Digital Mic Switch' off"
		cset "name='Digimic LR Swap' Not swapped"
		cset "name='TX1 Digital Capture Volume' 15,15"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
	}
}
