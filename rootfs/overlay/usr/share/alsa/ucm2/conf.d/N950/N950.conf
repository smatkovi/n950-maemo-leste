# Nokia N950 (and N9): TWL5031 for the loudspeaker (and earpiece),
# TLV320DAC33 + TPA6140A2 for the headphones, one card (snd-soc-n950).
# Settings after Nokia's PulseAudio paths in Harmattan
# (nokia-dfl61-twl4030-output-ihf, nokia-dfl61-dac33-output-headphone).
SectionUseCase."HiFi" {
	File "/Nokia/N950/HiFi.conf"
	Comment "Play HiFi quality music"
}
