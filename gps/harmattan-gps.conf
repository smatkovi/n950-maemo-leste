<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Harmattan's nped in its chroot (harmattan-gps) on Leste's system bus -->
<busconfig>
  <policy user="root">
    <allow own="com.nokia.location.nped"/>
    <allow send_destination="com.nokia.location.nped"/>
  </policy>
</busconfig>
